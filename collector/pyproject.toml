
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lively"
version = "0.1.0"
description = "Job liveness detection CLI"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary,pool]",
    "httpx",
]

[project.scripts]
lively = "lively.cli:main"

[tool.setuptools.packages.find]
where = ["."]
