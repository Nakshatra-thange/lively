x-app-env: &app-env
  DATABASE_URL: postgresql://lively:lively@db:5432/lively
  REDIS_URL: redis://redis:6379/0
  CONCURRENCY: "20"
  USER_AGENT: "LivelyBot/0.1 (job liveness research)"
  DOMAIN_RPS: "4"
  DOMAIN_BURST: "8"
  TIME_SCALE: "1"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lively
      POSTGRES_PASSWORD: lively
      POSTGRES_DB: lively
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lively -d lively"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./collector
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./collector:/app
    command: ["python", "-m", "lively.cli", "migrate"]
    restart: "no"

  bootstrap:
    profiles: ["init"]
    build: ./collector
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./collector:/app
    command: ["python", "-m", "lively.cli", "bootstrap"]
    restart: "no"

  collector:
    build: ./collector
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./collector:/app
    command: ["sleep", "infinity"]

  worker:
    build: ./collector
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./collector:/app
    command: ["python", "-m", "lively.cli", "worker"]
    restart: unless-stopped
    stop_grace_period: 40s

  metrics:
    build: ./collector
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./collector:/app
    ports:
      - "9100:9100"
    command: ["python", "-m", "lively.cli", "serve-metrics", "--port", "9100"]
    restart: unless-stopped
  
  ghost:
    build: ./collector
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - ./collector:/app
    command: ["python", "-m", "lively.ghost", "loop", "--every", "600"]
    restart: unless-stopped
    
  api:
    build: ./collector
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./collector:/app
      - ./web:/web:ro
    ports:
      - "8000:8000"
    command: ["uvicorn", "lively.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

volumes:
  pgdata: