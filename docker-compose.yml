services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lively
      POSTGRES_PASSWORD: lively
      POSTGRES_DB: lively
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lively -d lively"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  collector:
    build: ./collector
    environment:
      DATABASE_URL: postgresql://lively:lively@db:5432/lively
      CONCURRENCY: "20"
      USER_AGENT: "LivelyBot/0.1 (job liveness research)"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./collector:/app
    command: ["sleep", "infinity"]

volumes:
  pgdata:
